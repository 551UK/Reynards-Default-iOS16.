name: Inspect eBay shared link
on:
  push:
    paths: ['.github/workflows/check-link.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve short URL
        shell: bash
        run: |
          set +e
          url="https://ebay.io/m/CgvPmU"
          echo "Final:"
          curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 16_3 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1" --max-time 25 -D headers.txt -o response.html -w 'HTTP %{http_code}\nURL %{url_effective}\nREDIRECTS %{num_redirects}\nSIZE %{size_download}\n' "$url"
          echo "Redirect response locations:"
          grep -iE '^(HTTP/|location:|content-type:)' headers.txt | head -30
          echo "Page listing reference:"
          grep -oE '(https://(www\.)?ebay\.(co\.uk|com)/itm/[^" <]+|itemId[^" <]{0,60}|rel="canonical"[^>]+|property="og:url"[^>]+)' response.html | head -12 | cut -c 1-200
          echo "Done"
